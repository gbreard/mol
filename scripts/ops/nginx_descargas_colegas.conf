# nginx — canal de descarga de la base de colegas.
#
# Se inserta DENTRO del server{} TLS existente (/etc/nginx/sites-enabled/datasette),
# que hoy proxea "/" a Metabase (127.0.0.1:3000). Esta location no toca eso.
#
# POR QUÉ un directorio dedicado y no /srv/datasette:
#   /srv/datasette contiene `datasette.env`, que guarda el hash de la contraseña
#   del Datasette viejo. Servir ese directorio expondría el archivo. /srv/descargas
#   contiene SÓLO los artefactos publicados (symlinks a los .sqlite/.gz/.sha256).
#
# POR QUÉ con contraseña:
#   El archivo trae texto crudo de avisos — puede incluir nombres, mails y teléfonos —
#   y la guía dice "uso interno del equipo, no redistribuir". Sin auth quedaría
#   accesible a cualquiera que pase por la IP, y además indexable. El Datasette de
#   junio también tenía clave; esto conserva ese criterio.

location /descargas/ {
    alias /srv/descargas/;

    auth_basic           "MOL — base de colegas";
    auth_basic_user_file /etc/nginx/.htpasswd_colegas;

    autoindex     on;
    autoindex_exact_size off;
    autoindex_localtime  on;

    # Descarga, no reproducción en el navegador.
    types { }
    default_type application/octet-stream;

    # Archivos de 2 GB sobre una red lenta: sin timeouts cortos y sin buffering.
    sendfile            on;
    tcp_nopush          on;
    send_timeout        1h;
    client_body_timeout 1h;

    # Que se pueda reanudar una descarga cortada (importante con red filtrada).
    add_header Accept-Ranges bytes;

    # No indexar en buscadores, por si alguna vez se afloja la auth.
    add_header X-Robots-Tag "noindex, nofollow" always;
}
